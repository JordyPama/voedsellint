<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voedsellint Beheer (Vlakken)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f0e8; height: 100vh; display: flex; flex-direction: column; }
  #map { flex: 1; width: 100%; }
  .controls { padding: 10px; background: #2d5016; color: white; display: flex; align-items: center; gap: 15px; }
  .btn { background: #5a8c2a; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<div class="controls">
  <h1>Beheer Voedsellint</h1>
  <button class="btn" onclick="saveToJSONBin()">💾 Alles opslaan naar JSONBin</button>
  <small>Gebruik de teken-tool op de kaart voor nieuwe percelen</small>
</div>
<div id="map"></div>

<script>
let map = L.map('map').setView([51.87, 5.38], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let drawnItems = new L.FeatureGroup().addTo(map);
let drawControl = new L.Control.Draw({
  draw: { polygon: { shapeOptions: { color: '#5a8c2a' } }, polyline: false, circle: false, marker: false, rectangle: true },
  edit: { featureGroup: drawnItems }
});
map.addControl(drawControl);

// Als er getekend wordt
map.on(L.Draw.Event.CREATED, function (e) {
  let layer = e.layer;
  drawnItems.addLayer(layer);
  layer.bindPopup("Nieuw perceel getekend!");
});

async function saveToJSONBin() {
  // Verzamel alle getekende polygonen
  let percelen = [];
  drawnItems.eachLayer(function (layer) {
    if (layer instanceof L.Polygon) {
      percelen.push({
        id: Date.now(),
        coordinaten: layer.getLatLngs()[0].map(p => [p.lat, p.lng])
      });
    }
  });

  // Hier vul je jouw eigen JSONBin ID en Master Key in
  const BIN_ID = '6a175381ddf5aa59f76d64e8'; 
  const API_KEY = '$2a$10$vbM.Jgf1lKg2xftJcoFMgulvnUHwiUOheAZfE3vEptV8LsAWbLQJ.';

  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(percelen)
  });
  alert('Opgeslagen!');
}
</script>
</body>
</html>
